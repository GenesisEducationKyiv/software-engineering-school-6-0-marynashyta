name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  IMAGE_NAME: release-notification-api

jobs:
  # ── Job 1: Static analysis ──────────────────────────────────────────────────
  lint:
    name: PHPStan (level 9)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/php-setup

      - name: Run PHPStan
        run: php -d memory_limit=512M vendor/bin/phpstan analyse --no-progress

      - name: Run PHPCS
        run: vendor/bin/phpcs

  # ── Job 1b: Architecture — layer boundaries, rules, service boundaries ─────
  architecture:
    name: Architecture (layers, rules, service boundaries)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/php-setup

      - name: Deptrac — monolith layer boundaries
        run: vendor/bin/deptrac analyse --no-progress --fail-on-uncovered

      - name: PHPArkitect — fine-grained rules
        run: vendor/bin/phparkitect check

      - name: Deptrac — cross-service boundaries
        run: vendor/bin/deptrac analyse --config-file=deptrac.services.yaml --no-progress --fail-on-uncovered

      - name: Compile architecture — validate manifest
        run: php bin/compile-architecture.php --manifest=architecture.php --check

  # ── Job 2: Validate compose & config files ─────────────────────────────────
  validate-configs:
    name: Validate Compose & Prometheus Config
    runs-on: ubuntu-latest
    needs: [lint]

    steps:
      - uses: actions/checkout@v4

      - name: Create .env for compose interpolation
        run: cp .env.example .env

      - name: Validate main compose
        run: docker compose config --quiet

      - name: Validate ELK overlay
        run: docker compose -f docker-compose.yml -f docker-compose.elk.yml config --quiet

      - name: Validate test compose
        run: docker compose -f docker-compose.test.yml config --quiet

      - name: Validate Prometheus config
        run: |
          docker run --rm \
            --entrypoint /bin/promtool \
            -v "${{ github.workspace }}/docker/prometheus.yml:/prometheus.yml:ro" \
            prom/prometheus:v2.54.1 \
            check config /prometheus.yml

  # ── Job 3: Notification service — lint, test, Docker build ────────────────
  notification-service:
    name: Notification Service
    runs-on: ubuntu-latest
    needs: [lint]
    defaults:
      run:
        working-directory: notification-service

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: notification-service/vendor
          key: ${{ runner.os }}-ns-composer-${{ hashFiles('notification-service/composer.lock') }}
          restore-keys: ${{ runner.os }}-ns-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPStan (level 9)
        run: php vendor/bin/phpstan analyse --no-progress

      - name: Run unit tests
        run: php vendor/bin/phpunit --colors=always

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: notification-service
          push: false
          load: true
          tags: notification-service:${{ github.sha }}

  # ── Job 4: Docker build + image scan ───────────────────────────────────────
  # Only runs when lint passes.
  build:
    name: Docker Build & Scan
    runs-on: ubuntu-latest
    needs: [lint]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get week number for cache rotation
        id: date
        run: echo "week=$(date +%Y-%W)" >> $GITHUB_OUTPUT

      - name: Build image (with GHA layer cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=build-${{ steps.date.outputs.week }}
          cache-to: type=gha,mode=max,scope=build-${{ steps.date.outputs.week }}

      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
