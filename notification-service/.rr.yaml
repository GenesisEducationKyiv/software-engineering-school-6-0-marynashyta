version: "3"

server:
  command: "php bin/grpc-worker.php"
  relay: "pipes"

grpc:
  listen: "tcp://0.0.0.0:50051"
  proto:
    - "proto/notification/v1/notification.proto"
  workers:
    pool:
      num_workers: 10
      max_jobs: 0
      allocate_timeout: 60s
      destroy_timeout: 60s

logs:
  mode: production
  level: warn
  channels:
    grpc:
      level: warn
